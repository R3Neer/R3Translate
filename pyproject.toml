[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "r3translate"
version = "0.2.0"
description = "Conservative, profile-driven Markdown translation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "R3Neer" }]
dependencies = [
  "r3-cli @ git+https://github.com/R3Neer/R3CLI.git@v0.4.1",
]

[project.optional-dependencies]
deepl = ["deepl>=1.32,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
r3translate = "r3translate.cli:main"

[project.urls]
Repository = "https://github.com/R3Neer/R3Translate"

[tool.hatch.build.targets.wheel]
packages = ["src/r3translate"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider", "--basetemp=.pytest-tmp"]
